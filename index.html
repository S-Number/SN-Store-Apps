<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SN Store - VPM Repository</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-sub: #8b949e;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --vcc-color: #007ACC;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    /* ヘッダーエリア */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 32px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #f0f6fc;
    }

    .header p {
      margin: 0 0 24px 0;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.5;
    }

    .vcc-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--accent-color);
      color: white;
      padding: 14px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
      transition: all 0.2s ease;
    }

    .vcc-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
    }

    /* パッケージ一覧エリア */
    .section-title {
      font-size: 18px;
      color: #f0f6fc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .package-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .package-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s ease;
    }

    .package-card:hover {
      border-color: #58a6ff;
    }

    .package-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .package-title {
      font-size: 18px;
      font-weight: bold;
      color: #58a6ff;
      margin: 0;
    }

    .package-version {
      background: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 12px;
      font-family: monospace;
    }

    .package-desc {
      font-size: 14px;
      color: var(--text-sub);
      margin: 0;
      line-height: 1.4;
    }

    .package-id {
      font-size: 12px;
      color: #484f58;
      font-family: monospace;
    }

    .loading {
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- メインヘッダー（VCC追加ボタン） -->
    <div class="header">
      <h1>SN Store Repository</h1>
      <p>VRChat Companion App (VCC) にリポジトリを追加して、以下のツールを一括管理できます。</p>
      
      <a class="vcc-btn" href="vcc://vpm/addRepo?url=https://S-Number.github.io/SN-Store-Repo/index.json">
        ➕ VCCにリポジトリを追加
      </a>
    </div>

    <!-- 登録パッケージ一覧 -->
    <div class="section-title">
      📦 登録されているパッケージ
    </div>

    <div id="package-list" class="package-list">
      <div class="loading">パッケージ情報を読み込み中...</div>
    </div>
  </div>

  <script>
    // index.json から自動的にパッケージ情報を取得して描画する
    async function loadPackages() {
      const container = document.getElementById('package-list');
      try {
        const response = await fetch('./index.json');
        if (!response.ok) throw new Error('index.json の読み込みに失敗しました');
        
        const data = await response.json();
        const packages = data.packages || {};

        container.innerHTML = '';

        if (Object.keys(packages).length === 0) {
          container.innerHTML = '<div class="loading">登録されているパッケージがありません。</div>';
          return;
        }

        // 各パッケージのカードを作成
        for (const [pkgName, pkgData] of Object.entries(packages)) {
          const versions = Object.keys(pkgData.versions || {});
          if (versions.length === 0) continue;

          // 最新バージョンを取得
          const latestVersionKey = versions[versions.length - 1];
          const latestInfo = pkgData.versions[latestVersionKey];

          const card = document.createElement('div');
          card.className = 'package-card';
          card.innerHTML = `
            <div class="package-header">
              <h2 class="package-title">${latestInfo.displayName || pkgName}</h2>
              <span class="package-version">v${latestInfo.version}</span>
            </div>
            <p class="package-desc">${latestInfo.description || '説明なし'}</p>
            <span class="package-id">${pkgName}</span>
          `;
          container.appendChild(card);
        }

      </div> catch (error) {
        console.error(error);
        container.innerHTML = '<div class="loading">パッケージ情報の取得に失敗しました。</div>';
      }
    }

    loadPackages();
  </script>

</body>
</html>

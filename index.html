<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- 💡 ページが開いた瞬間に VCC 起動ダイアログを自動呼出 -->
  <meta http-equiv="refresh" content="0;url=vcc://vpm/addRepo?url=https://S-Number.github.io/SN-Store-Repo/index.json">
  
  <title>SN Store - VPM Repository</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-sub: #8b949e;
      
      /* メインカラー定義 (#A970FF) */
      --main-purple: #A970FF;
      --main-purple-dark: #823be8;
      --main-purple-hover: #9353FF;
      --main-purple-light: #D2B0FF;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      max-width: 680px;
      width: 100%;
      margin-top: auto;
      margin-bottom: auto;
    }

    /* ヘッダーエリア */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
    }

    /* ヘッダー上部のほのかな発光アクセント */
    .header::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 120px;
      background: var(--main-purple);
      filter: blur(60px);
      opacity: 0.25;
      pointer-events: none;
    }

    .header h1 {
      margin: 0 0 10px 0;
      font-size: 26px;
      color: #f0f6fc;
      letter-spacing: -0.5px;
    }

    .header p {
      margin: 0 0 28px 0;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ボタンエリア（メインボタン ＋ コピーボタン） */
    .btn-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* 💎 プレミアム VCC 追加ボタン */
    .vcc-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--main-purple) 0%, var(--main-purple-dark) 100%);
      color: #ffffff;
      padding: 15px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 4px 20px rgba(169, 112, 255, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    /* ホバー時の光彩（Shine）アニメーション */
    .vcc-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(25deg);
      transition: all 0.6s ease;
    }

    .vcc-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 28px rgba(169, 112, 255, 0.6);
      background: linear-gradient(135deg, var(--main-purple-hover) 0%, var(--main-purple) 100%);
    }

    .vcc-btn:hover::after {
      left: 130%;
    }

    .vcc-btn:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* 📋 URLコピー サブボタン */
    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 15px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:hover {
      background: #30363d;
      border-color: #8b949e;
      color: #ffffff;
    }

    .copy-btn:active {
      transform: scale(0.97);
    }

    .subtext {
      font-size: 12px;
      color: #6e7681;
      margin-top: 18px;
      margin-bottom: 0;
    }

    /* パッケージ一覧エリア */
    .section-title {
      font-size: 18px;
      color: #f0f6fc;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .package-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .package-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .package-card:hover {
      border-color: var(--main-purple);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(169, 112, 255, 0.12);
    }

    .package-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .package-title {
      font-size: 18px;
      font-weight: bold;
      color: var(--main-purple-light);
      margin: 0;
    }

    .package-version {
      background: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 12px;
      font-family: monospace;
    }

    .package-desc {
      font-size: 14px;
      color: var(--text-sub);
      margin: 0;
      line-height: 1.4;
    }

    .package-id {
      font-size: 12px;
      color: #484f58;
      font-family: monospace;
    }

    .loading {
      text-align: center;
      color: var(--text-sub);
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- メインヘッダー（VCC追加ボタン） -->
    <div class="header">
      <h1>SN Store Repository</h1>
      <p>VRChat Companion App (VCC) にリポジトリを追加呼び出し中...</p>
      
      <div class="btn-group">
        <!-- VCC起動ボタン -->
        <a class="vcc-btn" href="vcc://vpm/addRepo?url=https://S-Number.github.io/SN-Store-Repo/index.json">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          Add to VCC
        </a>

        <!-- URLコピーボタン -->
        <button class="copy-btn" onclick="copyRepoUrl()" id="copyBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copyBtnText">URLをコピー</span>
        </button>
      </div>

      <p class="subtext">※自動で開かない場合は「Add to VCC」を押すか、URLをコピーしてVCCに手動で登録してください。</p>
    </div>

    <!-- 登録パッケージ一覧 -->
    <div class="section-title">
      📦 配布中のパッケージ一覧
    </div>

    <div id="package-list" class="package-list">
      <div class="loading">パッケージ情報を読み込み中...</div>
    </div>
  </div>

  <script>
    const REPO_URL = "https://S-Number.github.io/SN-Store-Repo/index.json";

    // URLコピー機能
    function copyRepoUrl() {
      navigator.clipboard.writeText(REPO_URL).then(() => {
        const textEl = document.getElementById('copyBtnText');
        const origText = textEl.innerText;
        textEl.innerText = "コピー完了！";
        setTimeout(() => {
          textEl.innerText = origText;
        }, 2000);
      });
    }

    // index.json から自動的にパッケージ情報を取得して描画する
    async function loadPackages() {
      const container = document.getElementById('package-list');
      try {
        const response = await fetch('./index.json');
        if (!response.ok) throw new Error('index.json の読み込みに失敗しました');
        
        const data = await response.json();
        const packages = data.packages || {};

        container.innerHTML = '';

        if (Object.keys(packages).length === 0) {
          container.innerHTML = '<div class="loading">登録されているパッケージがありません。</div>';
          return;
        }

        // 各パッケージのカードを作成
        for (const [pkgName, pkgData] of Object.entries(packages)) {
          const versions = Object.keys(pkgData.versions || {});
          if (versions.length === 0) continue;

          // 最新バージョンを取得
          const latestVersionKey = versions[versions.length - 1];
          const latestInfo = pkgData.versions[latestVersionKey];

          const card = document.createElement('div');
          card.className = 'package-card';
          card.innerHTML = `
            <div class="package-header">
              <h2 class="package-title">${latestInfo.displayName || pkgName}</h2>
              <span class="package-version">v${latestInfo.version}</span>
            </div>
            <p class="package-desc">${latestInfo.description || '説明なし'}</p>
            <span class="package-id">${pkgName}</span>
          `;
          container.appendChild(card);
        }

      } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="loading">パッケージ情報の取得に失敗しました。</div>';
      }
    }

    loadPackages();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SN Store - VPM Repository</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 420px;
      width: 90%;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #f0f6fc;
    }
    p {
      font-size: 14px;
      color: #8b949e;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      background-color: #238636;
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #2ea043;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(35, 134, 54, 0.4);
    }
    .subtext {
      font-size: 12px;
      color: #6e7681;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>SN Store Repository</h1>
    <p>下のボタンを押すと VRChat Companion App (VCC) にリポジトリが追加されます。</p>
    
    <a class="btn" href="vcc://vpm/addRepo?url=https://S-Number.github.io/SN-Store-Repo/index.json">
      ➕ VCCに追加する
    </a>
    
    <p class="subtext">※「VRChat Companion App を開きますか？」と表示されたら「開く」を選択してください。</p>
  </div>
</body>
</html>
